stage_1:
  target: stage1.Flux2VAE
  params:
    resolution: 256

stage_2:
  target: stage2.models.lightningDiT.LightningDiT
  params:
    input_size: 16
    patch_size: 1
    in_channels: 128
    hidden_size: 384
    depth: 12
    num_heads: 6
    mlp_ratio: 4.0


conditioning:
  type: "text"
  cfg_dropout_prob: 0.1
  text_encoder:
    model_name: "Qwen/Qwen3-0.6B"
    max_length: 128
  arch:
      num_t_tokens: 4

transport:
  prediction: 'x'
  time_dist_type: 'logit-normal_-1.1_0.8'

sampler:
  num_steps: 50

guidance:
  cfg:
    scale: 6.0
    t_min: 0.0
    t_max: 1.0

dataset:
  target: 'dogs'
  type: 'wds'
  data_dir: "/data3/rey/dogs_wds/all"
  condition_type: "text"
  shuffle_buffer: 5000
  seed: 42
  shared_tmpdir: "~/tmp"

training:
  epochs: 500
  global_batch_size: 256
  grad_accum_steps: 1
  ema_decay: 0.9999
  num_workers: 4
  log_interval: 100
  checkpoint_interval: 10
  sample_every: 1000
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    lr: 1.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 10
    decay_end_epoch: 200
    base_lr: 1.0e-4
    final_lr: 1.0e-5
    warmup_from_zero: false
  image_size: 256

eval:
  eval_dir: "results/evals/stage2/training/dogs"
  datasets:
    dogs:
      target: dogs
      type: wds
      data_dir: "/data3/rey/dogs_wds/all"
      condition_type: "text"
      metrics:
        - fid
      reference_npz: "/data3/rey/dogs_wds/dogs_all_stats.npz"

misc:
  latent_size: [128, 16, 16]
  num_classes: 1000
  time_dist_shift_dim: 32768
  time_dist_shift_base: 4096
